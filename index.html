<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rock+Salt&display=swap"
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="app.css" />

    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main class="card">
      <img
        src="assets/images/avatar-jessica.jpeg"
        alt="Picture of Jessica Randall"
        width="75"
        height="75"
      />
      <header class="name">Jessica Randall</header>
      <hgroup class="city">London, United Kingdom</hgroup>
      <p>"Front-end developer and avid reader."</p>

      <div class="buttons">
        <a href="https://github.com/">GitHub</a>
        <a href="https://www.frontendmentor.io/">Frontend Mentor</a>
        <a href="https://www.linkedin.com/">LinkedIn</a>
        <a href="https://x.com/">Twitter</a>
        <a href="https://www.instagram.com/?hl=en">Instagram</a>
      </div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">AVL</a>.
    </footer>
  </body>
</html>
